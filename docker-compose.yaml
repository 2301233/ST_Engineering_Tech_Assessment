services:
  # Database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: csv_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d csv_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Service
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/csv_data
      PORT: 5000
    depends_on:
      - db
    command: >
      sh -lc "
      until pg_isready -h db -p 5432 -U user -d csv_data; do
        echo 'waiting for db...'; sleep 2;
      done;
      node dist/index.js
      "

  # Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    stdin_open: true
    environment:
      - VITE_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend

  frontend_test:
    build: ./frontend
    environment:
      NODE_ENV: test
      VITE_BACKEND_URL: http://backend:5000
    command: sh -lc "npm ci && npm test"
    depends_on:
      - backend
    restart: "no"

  backend_test:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: test
    command: sh -lc "npm ci && npm test"
    restart: "no"

volumes:
  postgres_data:
  backend_node_modules: